name: Application checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop-and-services:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libopengl0
      - run: pip install -r requirements.txt -r requirements-web.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m tools.benchmark
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-web.txt playwright
      - run: python -m playwright install --with-deps chromium webkit
      - run: python -m tests.browser_check
