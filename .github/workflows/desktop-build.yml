name: Windows desktop build
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-build.txt -r requirements-web.txt
      - run: python -m unittest discover -s tests -v
      - run: pyinstaller --noconfirm MEH_Cegprofil.spec
      - uses: actions/upload-artifact@v4
        with:
          name: MEH-Cegelemzo-Windows
          path: dist/MEH_Cegprofil/
          if-no-files-found: error
